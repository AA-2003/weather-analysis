name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python main.py --input tests/fixtures/synthetic_weather.csv
      - name: Prepare offline notebook data
        run: python -c "from weather import append_weather, read_weather; append_weather(read_weather('tests/fixtures/synthetic_weather.csv'), 'data/weather.csv')"
      - name: Execute notebook without API calls
        run: python -m nbconvert --to notebook --execute main.ipynb --output executed.ipynb --output-dir reports --ExecutePreprocessor.timeout=120
